name: Trivy Scan

on:
  workflow_call:
    inputs:
      scan-type:
        description: "fs | image"
        required: false
        type: string
        default: fs
      image-ref:
        description: "Docker image to scan e.g. myapp:abc1234"
        required: false
        type: string
        default: ""
      fail-on-findings:
        description: "Fail the job when vulnerabilities are found"
        required: false
        type: boolean
        default: true
      # NOTE: severity and scanners are now driven by tools/dependencies/trivy.yaml
      # No need to pass them as inputs anymore

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # ── Filesystem scan ───────────────────────────────────────────────────
      - name: Trivy – Filesystem Scan
        if: ${{ inputs.scan-type == 'fs' }}
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: "."
          trivy-config: tools/dependencies/trivy.yaml   # ← reads policy-driven config
          exit-code: ${{ inputs.fail-on-findings && '1' || '0' }}
          format: sarif
          output: trivy-results.sarif

      # ── Image scan ────────────────────────────────────────────────────────
      - name: Download Docker image artifact
        if: ${{ inputs.scan-type == 'image' && inputs.image-ref != '' }}
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        if: ${{ inputs.scan-type == 'image' && inputs.image-ref != '' }}
        run: docker load -i /tmp/image.tar

      - name: Trivy – Image Scan
        if: ${{ inputs.scan-type == 'image' && inputs.image-ref != '' }}
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image-ref }}
          trivy-config: tools/dependencies/trivy.yaml   # ← reads policy-driven config
          exit-code: ${{ inputs.fail-on-findings && '1' || '0' }}
          format: sarif
          output: trivy-results.sarif

      # ── Human-readable table summary in logs ──────────────────────────────
      - name: Trivy – Table Summary
        if: always()
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ inputs.scan-type == 'image' && inputs.image-ref || '.' }}
          trivy-config: tools/dependencies/trivy.yaml   # ← same config, table format
          exit-code: "0"                                # never fail here
          format: table

      # ── Upload SARIF → GitHub Security tab ───────────────────────────────
      - name: Upload SARIF Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy