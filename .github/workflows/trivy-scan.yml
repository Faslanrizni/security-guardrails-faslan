name: Trivy Scan

on:
  workflow_call:
    inputs:
      scan-type:
        description: "fs | image"
        required: false
        type: string
        default: fs
      image-ref:
        description: "Docker image to scan e.g. ghcr.io/org/myapp:abc1234"
        required: false
        type: string
        default: ""
      fail-on-findings:
        description: "Fail the job when vulnerabilities are found"
        required: false
        type: boolean
        default: true

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      packages: read        # needed to pull images from GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install Trivy manually (avoids aquasecurity/setup-trivy binary download failures) ──
      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.58.1"
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb" \
            -O /tmp/trivy.deb
          sudo dpkg -i /tmp/trivy.deb
          trivy --version

      # ── Trivy DB cache ────────────────────────────────────────────────────
      - name: Cache Trivy DB
        id: cache-trivy-db
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Update Trivy DB
        if: steps.cache-trivy-db.outputs.cache-hit != 'true'
        run: trivy image --download-db-only --no-progress

      # ── Log in to GHCR (image scan only) ─────────────────────────────────
      - name: Log in to GHCR
        if: ${{ inputs.scan-type == 'image' && inputs.image-ref != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Filesystem scan ───────────────────────────────────────────────────
      - name: Trivy – Filesystem Scan (SARIF)
        if: ${{ inputs.scan-type == 'fs' }}
        run: |
          EXIT_CODE=${{ inputs.fail-on-findings && '1' || '0' }}
          set +e
          trivy fs . \
            --config    policies/trivy.yaml \
            --format    sarif \
            --output    trivy-results.sarif \
            --exit-code $EXIT_CODE
          SCAN_EXIT=$?
          echo "SCAN_EXIT=$SCAN_EXIT" >> $GITHUB_ENV
          exit 0

      - name: Trivy – Filesystem Scan (Table summary)
        if: ${{ inputs.scan-type == 'fs' }}
        run: |
          trivy fs . \
            --config    policies/trivy.yaml \
            --format    table \
            --exit-code 0 \
            --severity  HIGH,CRITICAL || true

      # ── Image scan ────────────────────────────────────────────────────────
      - name: Trivy – Image Scan (SARIF)
        if: ${{ inputs.scan-type == 'image' && inputs.image-ref != '' }}
        run: |
          EXIT_CODE=${{ inputs.fail-on-findings && '1' || '0' }}
          set +e
          trivy image \
            --config    policies/trivy.yaml \
            --format    sarif \
            --output    trivy-results.sarif \
            --exit-code $EXIT_CODE \
            "${{ inputs.image-ref }}"
          SCAN_EXIT=$?
          echo "SCAN_EXIT=$SCAN_EXIT" >> $GITHUB_ENV
          exit 0

      - name: Trivy – Image Scan (Table summary)
        if: ${{ inputs.scan-type == 'image' && inputs.image-ref != '' }}
        run: |
          trivy image \
            --config    policies/trivy.yaml \
            --format    table \
            --exit-code 0 \
            --severity  HIGH,CRITICAL \
            "${{ inputs.image-ref }}" || true

      # ── Ensure SARIF exists before upload ─────────────────────────────────
      # Prevents codeql upload-sarif from failing if no scan ran
      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]}' \
              > trivy-results.sarif
          fi

      # ── Upload SARIF → GitHub Security tab ───────────────────────────────
      - name: Upload SARIF Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # ── Enforce fail gate ─────────────────────────────────────────────────
      - name: Fail on findings
        if: ${{ inputs.fail-on-findings && env.SCAN_EXIT == '1' }}
        run: |
          echo "Trivy found HIGH/CRITICAL vulnerabilities — failing pipeline."
          exit 1