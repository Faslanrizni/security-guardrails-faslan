name: Trivy Scan

on:
  workflow_call:
    inputs:
      scan-type:
        description: "fs | image"
        required: false
        type: string
        default: fs
      image-ref:
        description: "Docker image to scan e.g. ghcr.io/org/myapp:abc1234"
        required: false
        type: string
        default: ""
      fail-on-findings:
        description: "Fail the job when vulnerabilities are found"
        required: false
        type: boolean
        default: true
      # NOTE: severity and scanners are now driven by tools/dependencies/trivy.yaml
      # No need to pass them as inputs anymore

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      packages: read        # needed to pull images from GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # ── Filesystem scan ───────────────────────────────────────────────────
      - name: Trivy – Filesystem Scan
        if: ${{ inputs.scan-type == 'fs' }}
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: "."
          trivy-config: policies/trivy.yaml   # ← reads policy-driven config
          exit-code: ${{ inputs.fail-on-findings && '1' || '0' }}
          format: sarif
          output: trivy-results.sarif

      # ── Image scan ────────────────────────────────────────────────────────
      # Image is pulled directly from GHCR — no tar artifact needed.
      # The build job pushes to GHCR before this workflow runs.

      - name: Log in to GHCR
        if: ${{ inputs.scan-type == 'image' && inputs.image-ref != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy – Image Scan
        if: ${{ inputs.scan-type == 'image' && inputs.image-ref != '' }}
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image-ref }}
          trivy-config: policies/trivy.yaml   # ← reads policy-driven config
          exit-code: ${{ inputs.fail-on-findings && '1' || '0' }}
          format: sarif
          output: trivy-results.sarif

      # ── Human-readable table summary in logs ──────────────────────────────
      - name: Trivy – Table Summary
        if: always()
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: ${{ inputs.scan-type == 'image' && inputs.image-ref != '' && 'image' || 'fs' }}
          scan-ref: ${{ inputs.scan-type == 'image' && inputs.image-ref != '' && inputs.image-ref || '.' }}
          trivy-config: policies/trivy.yaml
          exit-code: "0"                      # never fail on summary step
          format: table
          severity: HIGH,CRITICAL

      # ── Upload SARIF → GitHub Security tab ───────────────────────────────
      - name: Upload SARIF Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy