name: Security Guardrails

on:
  workflow_call:
    inputs:
      image-ref:
        required: false
        type: string
        default: ""
    secrets:
      FOSSA_API_KEY:
        required: false

jobs:
  trivy-fs:
    name: Trivy – Filesystem Scan
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/trivy-scan.yml@main
    with:
      scan-type: fs
      fail-on-findings: true
    permissions:
      contents: read
      security-events: write

  trivy-image:
    name: Trivy – Docker Image Scan
    if: ${{ inputs.image-ref != '' }}
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/trivy-scan.yml@main
    with:
      scan-type: image
      image-ref: ${{ inputs.image-ref }}
      fail-on-findings: true
    permissions:
      contents: read
      security-events: write