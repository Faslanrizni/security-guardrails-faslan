name: Security Guardrails

on:
  workflow_call:
    inputs:
      image-ref:
        required: false
        type: string
        default: ""
      artifact-path:
        required: false
        type: string
        default: ""
    secrets:
      FOSSA_API_KEY:
        required: false

# ── ORCHESTRATOR PERMISSIONS ──────────────────────────────────────────────────
# Must declare the UNION of all permissions needed by every nested job.
# Each job below restricts further to only what it needs.
# The caller (product repo security.yml) must grant AT LEAST these permissions.
permissions:
  contents: write
  security-events: write
  pull-requests: write
  issues: write
  id-token: write
  attestations: write
  packages: write

jobs:
  trivy-fs:
    name: Trivy – Filesystem Scan
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/trivy-scan.yml@main
    with:
      scan-type: fs
      fail-on-findings: true
    permissions:
      contents: read
      security-events: write

  trivy-image:
    name: Trivy – Docker Image Scan
    if: ${{ inputs.image-ref != '' }}
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/trivy-scan.yml@main
    with:
      scan-type: image
      image-ref: ${{ inputs.image-ref }}
      fail-on-findings: true
    permissions:
      contents: read
      security-events: write

  gosec:
    name: Gosec – SAST Scan
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/gosec-scan.yml@testing
    with:
      fail-on-findings: true
    permissions:
      contents: read
      security-events: write

  secrets-scan:
    name: Secrets Scan
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/secrets-scan.yml@testing
    with:
      block-on-findings: true
    permissions:
      contents: read
      pull-requests: write
      issues: write

  fossa-scan:
    name: FOSSA – License & Dependency Scan
    # Only runs when a FOSSA_API_KEY secret is available
    if: ${{ inputs.FOSSA_API_KEY != '' }}
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/fossa-scan.yml@testing
    with:
      block-on-findings: true
      image-ref: ${{ inputs.image-ref }}   # pass image through for container scan
    secrets:
      FOSSA_API_KEY: ${{ inputs.FOSSA_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
      issues: write

  ai-detection:
    name: AI Code Detection
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/ai-detection.yml@testing
    with:
      block-on-detection: true
    permissions:
      contents: read
      pull-requests: write

  allowed-dependencies:
    name: Allowed Dependencies Check
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/allowed-dependencies.yml@testing
    with:
      block-on-unapproved: true
    permissions:
      contents: read
      pull-requests: write

  supply-chain-provenance:
    name: Supply Chain Provenance
    needs:
      - secrets-scan
      - allowed-dependencies
      - gosec
    if: ${{ !failure() && !cancelled() }}
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/supply-chain-provenance.yml@testing
    with:
      image-ref:        ${{ inputs.image-ref }}
      artifact-path:    ${{ inputs.artifact-path }}
      block-on-failure: true
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
      pull-requests: write