name: Security Guardrails

on:
  workflow_call:
    inputs:
      image-ref:
        required: false
        type: string
        default: ""
    secrets:
      FOSSA_API_KEY:
        required: false

# Grant permissions needed by all nested workflows, including ai-detection
permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  trivy-fs:
    name: Trivy – Filesystem Scan
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/trivy-scan.yml@main
    with:
      scan-type: fs
      fail-on-findings: true
    permissions:
      contents: read
      security-events: write

  trivy-image:
    name: Trivy – Docker Image Scan
    if: ${{ inputs.image-ref != '' }}
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/trivy-scan.yml@main
    with:
      scan-type: image
      image-ref: ${{ inputs.image-ref }}
      fail-on-findings: true
    permissions:
      contents: read
      security-events: write

  gosec:
    name: Gosec – SAST Scan
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/gosec-scan.yml@testing
    with:
      fail-on-findings: true
    permissions:
      contents: read
      security-events: write

  ai-detection:
    name: AI Code Detection
    uses: Faslanrizni/security-guardrails-faslan/.github/workflows/ai-detection.yml@testing
    with:
      block-on-detection: true
    permissions:
      contents: read
      pull-requests: write
