name: Allowed Dependencies Check

on:
  workflow_call:
    inputs:
      block-on-unapproved:
        description: "Block merge when unapproved packages are found"
        required: false
        type: boolean
        default: true

jobs:
  allowed-dependencies:
    name: Allowed Dependencies Check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout product repo
        uses: actions/checkout@v4
        with:
          path: product

      - name: Checkout guardrails repo
        uses: actions/checkout@v4
        with:
          repository: Faslanrizni/security-guardrails-faslan
          ref: testing # update the correct guarrails branch here
          path: guardrails

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Initialise results file
        run: |
          echo '{"version":"1.0.0","blocked":false,"total_violations":0,"findings":[]}' \
            > dep-check-results.json

      - name: Run Allowed Dependencies Enforcer
        run: |
          set +e

          python guardrails/tools/dependencies/allowed-dependencies-enforcer.py \
            --repo    product \
            --policy  guardrails/policies/allowed-dependencies.yaml \
            --json-output dep-check-results.json \
            --verbose

          ENFORCER_EXIT=$?
          echo "ENFORCER_EXIT=$ENFORCER_EXIT" >> $GITHUB_ENV

          exit 0

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-check-results
          path: dep-check-results.json
          retention-days: 30

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';

            try {
              const raw  = fs.readFileSync('dep-check-results.json', 'utf8');
              const data = JSON.parse(raw);

              if (data.blocked) {
                body  = `##  Dependency Check — Merge Blocked\n\n`;
                body += `**${data.total_violations}** unapproved or blocked package(s) found.\n\n`;
                body += `> To get a package approved: open a PR in the \`security-guardrails\` repo `;
                body += `and add it to \`policies/allowed-dependencies.yaml\`.\n\n`;
              } else if (data.findings && data.findings.length > 0) {
                body  = `##  Dependency Check — Warnings\n\n`;
                body += `**${data.findings.length}** package(s) require attention (build not blocked).\n\n`;
              } else {
                body  = `##  Dependency Check — All Clear\n\nAll dependencies are approved.`;
              }

              if (data.findings && data.findings.length > 0) {
                body += `**Findings:**\n`;
                for (const f of data.findings) {
                  const icon = f.kind === 'blocked'         ? '🚫'
                             : f.kind === 'requires_review'  ? '⚠️' : '❌';
                  body += `\n${icon} \`${f.package}\` (${f.language} · ${f.version}) — **${f.kind}**`;
                  if (f.reason) body += `\n  > ${f.reason}`;
                }
              }
            } catch (e) {
              body = `## ⚠️ Dependency Check — Could not parse results\n\n${e.message}`;
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce Block Policy
        if: ${{ inputs.block-on-unapproved }}
        run: |
          echo "Enforcer exit code: ${{ env.ENFORCER_EXIT }}"
          if [ "${{ env.ENFORCER_EXIT }}" = "1" ]; then
            echo "🚫 Unapproved or blocked dependencies found — blocking merge."
            exit 1
          fi
          echo "✅ All dependencies approved."