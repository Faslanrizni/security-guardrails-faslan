name: Supply Chain Provenance

on:
  workflow_call:
    inputs:
      image-ref:
        description: "Docker image to sign e.g. myapp:abc1234 (optional)"
        required: false
        type: string
        default: ""
      artifact-path:
        description: "Path to binary / release artifact to sign (optional)"
        required: false
        type: string
        default: ""
      block-on-failure:
        description: "Block merge when provenance cannot be established"
        required: false
        type: boolean
        default: true

# ── Minimal required permissions ─────────────────────────────────────────────
# id-token  → request OIDC token for Sigstore/Cosign keyless signing
# contents  → read source, write attestations
# packages  → push signed OCI images (if registry is GHCR)
permissions:
  id-token: write
  contents: write
  packages: write
  pull-requests: write
  attestations: write

jobs:
  supply-chain-provenance:
    name: Supply Chain Provenance
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout product repo
        uses: actions/checkout@v4
        with:
          path: product

      - name: Checkout guardrails repo
        uses: actions/checkout@v4
        with:
          repository: Faslanrizni/security-guardrails-faslan
          ref: testing
          path: guardrails

      # ── Install tools ─────────────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0.17.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      # ── Initialise report ─────────────────────────────────────────────────
      - name: Initialise provenance report
        run: |
          echo '{
            "version": "1.0.0",
            "blocked": false,
            "steps": {
              "sbom": "pending",
              "signing": "pending",
              "provenance": "pending"
            },
            "artifacts": []
          }' > provenance-report.json

      # ══════════════════════════════════════════════════════════════════════
      # STEP 1 — SBOM GENERATION
      # Generate a Software Bill of Materials for the source tree.
      # This lists every package, dependency, and transitive dep — making
      # the complete composition of the artifact auditable and traceable.
      # ══════════════════════════════════════════════════════════════════════
      - name: Generate SBOM (Source)
        id: sbom-source
        run: |
          set +e
          syft product \
            --output spdx-json=sbom-source.spdx.json \
            --output cyclonedx-json=sbom-source.cdx.json \
            --output table
          EXIT=$?
          echo "SBOM_EXIT=$EXIT" >> $GITHUB_ENV
          exit 0

      - name: Generate SBOM (Docker Image)
        if: ${{ inputs.image-ref != '' }}
        run: |
          set +e
          syft "${{ inputs.image-ref }}" \
            --output spdx-json=sbom-image.spdx.json \
            --output cyclonedx-json=sbom-image.cdx.json
          exit 0

      # ══════════════════════════════════════════════════════════════════════
      # STEP 2 — ARTIFACT SIGNING (Cosign keyless via OIDC)
      # Signs the SBOM and any binary artifact using Sigstore's keyless
      # signing flow. No private key to manage — identity is the GitHub
      # Actions OIDC token (tied to this repo + workflow + commit).
      # Signatures are stored in the Sigstore transparency log (Rekor)
      # which is append-only and publicly auditable.
      # ══════════════════════════════════════════════════════════════════════
      - name: Sign SBOM (keyless via Sigstore)
        id: sign-sbom
        run: |
          set +e

          cosign sign-blob \
            --yes \
            --output-signature sbom-source.spdx.json.sig \
            --output-certificate sbom-source.spdx.json.pem \
            sbom-source.spdx.json

          COSIGN_EXIT=$?
          echo "COSIGN_EXIT=$COSIGN_EXIT" >> $GITHUB_ENV

          if [ "$COSIGN_EXIT" = "0" ]; then
            echo " SBOM signed successfully"
          else
            echo "⚠  Cosign signing failed (exit $COSIGN_EXIT)"
          fi

          exit 0

      - name: Sign Docker Image (keyless via Sigstore)
        if: ${{ inputs.image-ref != '' }}
        run: |
          set +e
          cosign sign \
            --yes \
            "${{ inputs.image-ref }}"
          echo "IMAGE_SIGN_EXIT=$?" >> $GITHUB_ENV
          exit 0

      - name: Sign Binary Artifact
        if: ${{ inputs.artifact-path != '' }}
        run: |
          set +e
          cosign sign-blob \
            --yes \
            --output-signature "${{ inputs.artifact-path }}.sig" \
            --output-certificate "${{ inputs.artifact-path }}.pem" \
            "${{ inputs.artifact-path }}"
          echo "ARTIFACT_SIGN_EXIT=$?" >> $GITHUB_ENV
          exit 0

      # ══════════════════════════════════════════════════════════════════════
      # STEP 3 — SLSA PROVENANCE ATTESTATION
      # Creates a signed attestation describing HOW the artifact was built:
      # which repo, which commit, which workflow, which runner.
      # This is the "reproducibility" guarantee — anyone can verify the
      # build process, not just the output.
      # SLSA L3 is the gold standard; this achieves SLSA L2.
      # ══════════════════════════════════════════════════════════════════════
      - name: Attest SBOM provenance (SLSA)
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            sbom-source.spdx.json
            sbom-source.cdx.json

      - name: Attest Docker Image provenance
        if: ${{ inputs.image-ref != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ inputs.image-ref }}

      # ══════════════════════════════════════════════════════════════════════
      # STEP 4 — POLICY VERIFICATION
      # Apply policies/supply-chain.yaml to determine if all required
      # controls were satisfied. This is what makes the step blocking.
      # ══════════════════════════════════════════════════════════════════════
      - name: Apply Supply Chain Policy
        run: |
          set +e

          python guardrails/tools/supply-chain/provenance-checker.py \
            --policy      guardrails/policies/supply-chain.yaml \
            --sbom-file   sbom-source.spdx.json \
            --sig-file    sbom-source.spdx.json.sig \
            --cosign-exit "$COSIGN_EXIT" \
            --json-output provenance-report.json \
            --verbose

          CHECKER_EXIT=$?
          echo "CHECKER_EXIT=$CHECKER_EXIT" >> $GITHUB_ENV
          exit 0

      # ── Upload all artifacts ──────────────────────────────────────────────
      - name: Upload Supply Chain Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            sbom-source.spdx.json
            sbom-source.cdx.json
            sbom-source.spdx.json.sig
            sbom-source.spdx.json.pem
            provenance-report.json
          retention-days: 90    # keep longer — supply chain evidence for audits

      # ── PR Comment ───────────────────────────────────────────────────────
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';

            try {
              const raw  = fs.readFileSync('provenance-report.json', 'utf8');
              const data = JSON.parse(raw);
              const s    = data.steps || {};

              const icon = (v) => v === 'passed' ? '✅' : v === 'failed' ? '❌' : '⏳';

              if (data.blocked) {
                body  = `##  Supply Chain Provenance — Merge Blocked\n\n`;
                body += `One or more required supply chain controls failed.\n\n`;
              } else {
                body  = `##  Supply Chain Provenance — Passed\n\n`;
                body += `All required supply chain controls verified.\n\n`;
              }

              body += `| Control | Status |\n|---|---|\n`;
              body += `| SBOM Generated | ${icon(s.sbom)} ${s.sbom} |\n`;
              body += `| Artifact Signed (Sigstore) | ${icon(s.signing)} ${s.signing} |\n`;
              body += `| SLSA Provenance Attested | ${icon(s.provenance)} ${s.provenance} |\n`;

              if (data.artifacts && data.artifacts.length > 0) {
                body += `\n**Signed artifacts:** ${data.artifacts.join(', ')}\n`;
              }

              body += `\n> Policy: \`policies/supply-chain.yaml\` · Evidence retained 90 days`;

            } catch (e) {
              body = `##  Supply Chain Provenance — Could not parse results\n\n${e.message}`;
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── Enforce block ─────────────────────────────────────────────────────
      - name: Enforce Block Policy
        if: ${{ inputs.block-on-failure }}
        run: |
          echo "Provenance checker exit: ${{ env.CHECKER_EXIT }}"
          if [ "${{ env.CHECKER_EXIT }}" = "1" ]; then
            echo " Supply chain provenance failed — blocking merge."
            exit 1
          fi
          echo " Supply chain provenance verified."