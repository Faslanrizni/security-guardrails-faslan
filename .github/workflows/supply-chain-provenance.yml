name: Supply Chain Provenance

on:
  workflow_call:
    inputs:
      image-ref:
        description: "Docker image to sign e.g. myapp:abc1234 (optional)"
        required: false
        type: string
        default: ""
      artifact-path:
        description: "Path to binary / release artifact to sign (optional)"
        required: false
        type: string
        default: ""
      block-on-failure:
        description: "Block merge when provenance cannot be established"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: write
  packages: write
  pull-requests: write
  attestations: write

jobs:
  supply-chain-provenance:
    name: Supply Chain Provenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout product repo
        uses: actions/checkout@v4
        with:
          path: product

      - name: Checkout guardrails repo
        uses: actions/checkout@v4
        with:
          repository: Faslanrizni/security-guardrails-faslan
          ref: testing
          path: guardrails

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0.17.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Initialise provenance report
        run: |
          echo '{
            "version": "1.0.0",
            "blocked": false,
            "steps": {
              "sbom": "pending",
              "signing": "pending",
              "provenance": "pending"
            },
            "artifacts": []
          }' > provenance-report.json

      # ══════════════════════════════════════════════════════════════════════
      # STEP 1 — SBOM GENERATION
      # ══════════════════════════════════════════════════════════════════════
      - name: Generate SBOM
        id: sbom
        run: |
          set +e

          syft product \
            --output spdx-json=sbom-source.spdx.json \
            --output cyclonedx-json=sbom-source.cdx.json \
            --output table

          SBOM_EXIT=$?
          echo "SBOM_EXIT=$SBOM_EXIT" >> $GITHUB_ENV

          if [ "$SBOM_EXIT" = "0" ]; then
            echo "SBOM_FILE=${{ github.workspace }}/sbom-source.spdx.json" >> $GITHUB_ENV
            echo " SBOM generated successfully"
            ls -lh sbom-source.spdx.json sbom-source.cdx.json
          else
            echo "⚠  Syft exited with code $SBOM_EXIT"
          fi

          exit 0

      # ══════════════════════════════════════════════════════════════════════
      # STEP 2 — ARTIFACT SIGNING
      # ══════════════════════════════════════════════════════════════════════
      - name: Sign SBOM (keyless via Sigstore)
        run: |
          set +e

          if [ "$SBOM_EXIT" != "0" ] || [ ! -f sbom-source.spdx.json ]; then
            echo "⚠  Skipping signing — SBOM not generated"
            echo "COSIGN_EXIT=1" >> $GITHUB_ENV
            exit 0
          fi

          cosign sign-blob \
            --yes \
            --output-signature sbom-source.spdx.json.sig \
            --output-certificate sbom-source.spdx.json.pem \
            sbom-source.spdx.json

          COSIGN_EXIT=$?
          echo "COSIGN_EXIT=$COSIGN_EXIT" >> $GITHUB_ENV

          if [ "$COSIGN_EXIT" = "0" ]; then
            echo " SBOM signed successfully"
          else
            echo "⚠  Cosign signing failed (exit $COSIGN_EXIT)"
          fi

          exit 0

      - name: Sign Docker Image
        if: ${{ inputs.image-ref != '' }}
        run: |
          set +e
          cosign sign --yes "${{ inputs.image-ref }}"
          echo "IMAGE_SIGN_EXIT=$?" >> $GITHUB_ENV
          exit 0

      - name: Sign Binary Artifact
        if: ${{ inputs.artifact-path != '' }}
        run: |
          set +e
          cosign sign-blob \
            --yes \
            --output-signature "${{ inputs.artifact-path }}.sig" \
            --output-certificate "${{ inputs.artifact-path }}.pem" \
            "${{ inputs.artifact-path }}"
          echo "ARTIFACT_SIGN_EXIT=$?" >> $GITHUB_ENV
          exit 0

      # ══════════════════════════════════════════════════════════════════════
      # STEP 3 — SLSA PROVENANCE ATTESTATION
      # subject-path must be an absolute path to an existing file.
      # The step is skipped entirely if SBOM generation failed — an empty
      # or missing file causes "subject-path must be provided" error.
      # ══════════════════════════════════════════════════════════════════════
      - name: Attest SBOM provenance (SLSA)
        if: ${{ env.SBOM_EXIT == '0' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ github.workspace }}/sbom-source.spdx.json"

      - name: Attest Docker Image provenance
        if: ${{ inputs.image-ref != '' && env.SBOM_EXIT == '0' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ github.workspace }}/sbom-source.spdx.json"

      # ══════════════════════════════════════════════════════════════════════
      # STEP 4 — POLICY VERIFICATION
      # ══════════════════════════════════════════════════════════════════════
      - name: Apply Supply Chain Policy
        run: |
          set +e

          python guardrails/tools/supply-chain/provenance-checker.py \
            --policy      guardrails/policies/supply-chain.yaml \
            --sbom-file   sbom-source.spdx.json \
            --sig-file    sbom-source.spdx.json.sig \
            --cosign-exit "${COSIGN_EXIT:-1}" \
            --json-output provenance-report.json \
            --verbose

          CHECKER_EXIT=$?
          echo "CHECKER_EXIT=$CHECKER_EXIT" >> $GITHUB_ENV
          exit 0

      - name: Upload Supply Chain Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            sbom-source.spdx.json
            sbom-source.cdx.json
            sbom-source.spdx.json.sig
            sbom-source.spdx.json.pem
            provenance-report.json
          retention-days: 90

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';

            try {
              const raw  = fs.readFileSync('provenance-report.json', 'utf8');
              const data = JSON.parse(raw);
              const s    = data.steps || {};

              const icon = (v) => v === 'passed' ? '✅' : v === 'failed' ? '❌' : '⏳';

              if (data.blocked) {
                body  = `## 🚫 Supply Chain Provenance — Merge Blocked\n\n`;
                body += `One or more required supply chain controls failed.\n\n`;
              } else {
                body  = `## ✅ Supply Chain Provenance — Passed\n\n`;
                body += `All required supply chain controls verified.\n\n`;
              }

              body += `| Control | Status |\n|---|---|\n`;
              body += `| SBOM Generated | ${icon(s.sbom)} ${s.sbom} |\n`;
              body += `| Artifact Signed (Sigstore) | ${icon(s.signing)} ${s.signing} |\n`;
              body += `| SLSA Provenance Attested | ${icon(s.provenance)} ${s.provenance} |\n`;

              body += `\n> Policy: \`policies/supply-chain.yaml\` · Evidence retained 90 days`;

            } catch (e) {
              body = `## ⚠️ Supply Chain Provenance — Could not parse results\n\n${e.message}`;
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce Block Policy
        if: ${{ inputs.block-on-failure }}
        run: |
          echo "Provenance checker exit: ${{ env.CHECKER_EXIT }}"
          if [ "${{ env.CHECKER_EXIT }}" = "1" ]; then
            echo "🚫 Supply chain provenance failed — blocking merge."
            exit 1
          fi
          echo "✅ Supply chain provenance verified."