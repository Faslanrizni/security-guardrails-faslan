name: Gosec Scan

on:
  workflow_call:
    inputs:
      fail-on-findings:
        description: "Fail the job when issues are found"
        required: false
        type: boolean
        default: true

jobs:
  gosec:
    name: Gosec – SAST Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      # ── Checkout ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Setup Go ─────────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ── Install Gosec ────────────────────────────────────────
      - name: Install Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      # ── Run Gosec (SARIF) ────────────────────────────────────
      # We capture exit code but do NOT fail immediately.
      - name: Run Gosec (SARIF)
        id: gosec
        run: |
          set +e
          ~/go/bin/gosec \
            -severity high \
            -confidence medium \
            -exclude=G104,G304 \
            -fmt sarif \
            -out gosec-results.sarif \
            ./...
          EXIT_CODE=$?
          echo "GOSEC_EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          exit 0

      # ── Human-readable summary ───────────────────────────────
      - name: Gosec – Table Summary
        if: always()
        run: |
          ~/go/bin/gosec \
            -severity high \
            -confidence medium \
            -exclude=G104,G304 \
            -fmt text \
            ./...

      # ── Upload SARIF to GitHub Security tab ──────────────────
      - name: Upload SARIF Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      # ── Controlled failure gate ──────────────────────────────
      - name: Fail if Findings
        if: ${{ inputs.fail-on-findings && env.GOSEC_EXIT_CODE != '0' }}
        run: |
          echo "Gosec findings detected. Failing pipeline."
          exit 1
