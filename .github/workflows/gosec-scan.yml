name: Gosec Scan

on:
  workflow_call:
    inputs:
      fail-on-findings:
        description: "Fail the job when issues are found"
        required: false
        type: boolean
        default: true

jobs:
  gosec:
    name: Gosec SAST Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Gosec (SARIF)
        run: |
          ~/go/bin/gosec \
            -severity high \
            -confidence medium \
            -exclude=G104,G304 \
            -fmt sarif \
            -out gosec-results.sarif \
            ./...

      - name: Run Gosec (Table Summary)
        if: always()
        run: |
          ~/go/bin/gosec \
            -severity high \
            -confidence medium \
            -exclude=G104,G304 \
            -fmt text \
            ./...

      - name: Upload SARIF Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Fail if Findings
        if: ${{ inputs.fail-on-findings }}
        run: |
          if [ -f gosec-results.sarif ]; then
            echo "Gosec findings detected"
            exit 1
          fi
