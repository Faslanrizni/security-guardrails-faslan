name: AI Code Detection

on:
  workflow_call:
    inputs:
      commit:
        description: "Commit SHA to scan (default: HEAD)"
        required: false
        type: string
        default: HEAD
      block-on-detection:
        description: "Block merge when high-confidence AI code is found"
        required: false
        type: boolean
        default: true

jobs:
  ai-detection:
    name: AI Code Detection
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # ── Checkout the product repo (the code being scanned) ────────────────
      - name: Checkout product repo
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 2

      # ── Checkout the guardrails repo (contains the detector script) ────────
      - name: Checkout guardrails repo
        uses: actions/checkout@v4
        with:
          repository: Faslanrizni/security-guardrails-faslan
          ref: testing
          path: guardrails

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pre-create JSON so artifact upload never fails even if detector crashes
      - name: Initialise results file
        run: |
          echo '{"version":"1.2.0","blocked":false,"findings":[]}' > ai-detection-results.json

      # ── Run detector ──────────────────────────────────────────────────────
      - name: Run AI Code Detector
        run: |
          set +e

          python guardrails/tools/ai-detection/ai-code-detector.py \
            --repo-path product \
            --commit ${{ inputs.commit }} \
            --json-output ai-detection-results.json \
            --verbose

          DETECTOR_EXIT=$?
          echo "DETECTOR_EXIT=$DETECTOR_EXIT" >> $GITHUB_ENV

          exit 0

      # ── Upload results as artifact ────────────────────────────────────────
      - name: Upload Detection Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-detection-results
          path: ai-detection-results.json
          retention-days: 30

      # ── Post PR comment with findings ─────────────────────────────────────
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';

            try {
              const raw  = fs.readFileSync('ai-detection-results.json', 'utf8');
              const data = JSON.parse(raw);

              if (data.blocked) {
                body = `##  AI Code Detected — Review Required\n\n`;
                body += `This PR contains code flagged as likely AI-generated.\n`;
                body += `A manual review is required before merge (per \`policies/ai-code.yaml\`).\n\n`;
              } else if (data.findings.length > 0) {
                body = `##  Possible AI Code Detected\n\n`;
                body += `Some files show patterns consistent with AI generation and have been flagged for review.\n\n`;
              } else {
                body = `##  AI Detection — Clean\n\nNo AI-generated code patterns detected.`;
              }

              if (data.findings.length > 0) {
                body += `**Findings (${data.findings.length}):**\n`;
                for (const f of data.findings) {
                  const icon = f.requires_review ? '🔴' : '🟡';
                  const label = f.file || 'Commit message';
                  body += `\n${icon} \`${label}\` — confidence: ${Math.round(f.confidence * 100)}%\n`;
                  const items = f.indicators || f.details || [];
                  for (const item of items.slice(0, 4)) {
                    body += `  - ${item}\n`;
                  }
                }
              }
            } catch (e) {
              body = `##  AI Detection — Could not parse results\n\n${e.message}`;
            }

            await github.rest.issues.createComment({
              owner:   context.repo.owner,
              repo:    context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── Enforce block policy ──────────────────────────────────────────────
      - name: Enforce Block Policy
        if: ${{ inputs.block-on-detection }}
        run: |
          echo "Detector exit code was: ${{ env.DETECTOR_EXIT }}"
          if [ "${{ env.DETECTOR_EXIT }}" = "1" ]; then
            echo " AI-generated code detected — blocking merge until review is complete."
            exit 1
          fi
          echo " No blocking AI findings."