name: Secrets Scan

on:
  workflow_call:
    inputs:
      block-on-findings:
        description: "Block merge when HIGH/CRITICAL secrets are found"
        required: false
        type: boolean
        default: true

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout product repo
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0         # full history — gitleaks scans all commits in the PR

      - name: Checkout guardrails repo
        uses: actions/checkout@v4
        with:
          repository: Faslanrizni/security-guardrails-faslan
          ref: testing
          path: guardrails

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests pyyaml

      # ── Pre-create report files ───────────────────────────────────────────
      - name: Initialise report files
        run: |
          echo '{"version":"2.0.0","blocked":false,"summary":{"total":0,"critical":0,"high":0,"medium":0},"findings":[]}' \
            > secrets-scan-results.json
          echo '{"version":"1.0.0","action":"freeze","simulation":true,"steps":[]}' \
            > freeze-report.json
          # Empty SARIF so post-processor never crashes even if gitleaks errors
          echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"rules":[]}},"results":[]}]}' \
            > gitleaks-results.sarif

      # ── Install Gitleaks ──────────────────────────────────────────────────
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          wget -q \
            "https://github.com/zricethezav/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -O /tmp/gitleaks.tar.gz
          tar -xz -C /tmp -f /tmp/gitleaks.tar.gz gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      # ── Run Gitleaks ─────────────────────────────────────────────────────
      # All secret patterns come from gitleaks.toml — single source of truth.
      # Exit code 2 = secrets found, 0 = clean, 1 = error.
      - name: Run Gitleaks
        run: |
          set +e

          /tmp/gitleaks detect \
            --source        product \
            --config        guardrails/tools/secrets/gitleaks.toml \
            --report-format sarif \
            --report-path   gitleaks-results.sarif \
            --redact \
            --verbose \
            --exit-code 2

          GITLEAKS_EXIT=$?
          echo "GITLEAKS_EXIT=$GITLEAKS_EXIT" >> $GITHUB_ENV

          if   [ "$GITLEAKS_EXIT" = "0" ]; then echo " Gitleaks: clean"
          elif [ "$GITLEAKS_EXIT" = "2" ]; then echo "⚠  Gitleaks: secrets found"
          else                                   echo "⚠  Gitleaks: scan error (exit $GITLEAKS_EXIT)"
          fi

          exit 0    # post-processor makes the final block decision

      # ── Post-process SARIF → JSON + apply policy ──────────────────────────
      # Reads gitleaks SARIF, applies severity from policies/secrets.yaml,
      # outputs standard JSON used by PR comment and freeze steps.
      - name: Process Results & Apply Policy
        run: |
          set +e

          python guardrails/tools/secrets/secrets-scanner.py \
            --sarif       gitleaks-results.sarif \
            --policy      guardrails/policies/secrets.yaml \
            --json-output secrets-scan-results.json \
            --verbose

          SCAN_EXIT=$?
          echo "SCAN_EXIT=$SCAN_EXIT" >> $GITHUB_ENV
          exit 0

      # ── Repo freeze on CRITICAL findings ──────────────────────────────────
      - name: Freeze repo on critical secret leak
        if: ${{ inputs.block-on-findings }}
        run: |
          set +e

          CRITICAL=$(python3 -c "
          import json
          data = json.load(open('secrets-scan-results.json'))
          crits = [f for f in data.get('findings', []) if f['severity'] == 'CRITICAL']
          if crits:
              print(crits[0]['type'])
          " 2>/dev/null)

          if [ -n "$CRITICAL" ]; then
            echo " CRITICAL secret detected: $CRITICAL — triggering repo freeze"
            python guardrails/tools/secrets/repo-freezer.py \
              "${{ github.repository }}" \
              --secret-type "$CRITICAL" \
              --description "Critical secret detected in CI scan" \
              --commit      "${{ github.sha }}" \
              --json-output freeze-report.json
          else
            echo " No CRITICAL secrets — skipping freeze"
          fi

          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Upload reports ────────────────────────────────────────────────────
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-results
          path: |
            secrets-scan-results.json
            freeze-report.json
            gitleaks-results.sarif
          retention-days: 30

      # ── PR comment ────────────────────────────────────────────────────────
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';

            try {
              const raw  = fs.readFileSync('secrets-scan-results.json', 'utf8');
              const data = JSON.parse(raw);
              const s    = data.summary || {};
              const p    = data.policy  || {};

              if (data.blocked) {
                body  = `##  Secrets Detected — Merge Blocked\n\n`;
                body += `**${s.total || 0}** secret(s) found: `;
                body += `${s.critical || 0} critical · ${s.high || 0} high · ${s.medium || 0} medium\n\n`;
                body += `> Rotate all exposed credentials immediately before this PR can be merged.\n\n`;
              } else if ((s.total || 0) > 0) {
                body  = `##  Possible Secrets Detected\n\n`;
                body += `**${s.total}** finding(s) flagged for review.\n\n`;
              } else {
                body  = `##  Secrets Scan — Clean\n\nNo secrets detected.`;
              }

              if (p.block_on_severity) {
                body += `> Block policy: \`${p.block_on_severity.join(', ')}\`\n\n`;
              }

              if (data.findings && data.findings.length > 0) {
                body += `**Findings:**\n`;
                for (const f of data.findings.slice(0, 10)) {
                  const icon = f.severity === 'CRITICAL' ? '🔴'
                             : f.severity === 'HIGH'     ? '🟠' : '🟡';
                  body += `\n${icon} \`${f.file}:${f.line}\` — \`${f.type}\``;
                }
                if (data.findings.length > 10) {
                  body += `\n\n_...and ${data.findings.length - 10} more. Download the artifact for the full report._`;
                }
              }
            } catch (e) {
              body = `##  Secrets Scan — Could not parse results\n\n${e.message}`;
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── Enforce block ─────────────────────────────────────────────────────
      - name: Enforce Block Policy
        if: ${{ inputs.block-on-findings }}
        run: |
          echo "Gitleaks exit : ${{ env.GITLEAKS_EXIT }}"
          echo "Policy exit   : ${{ env.SCAN_EXIT }}"

          # Block if policy says so (SCAN_EXIT=1) OR gitleaks found something (GITLEAKS_EXIT=2)
          if [ "${{ env.SCAN_EXIT }}" = "1" ]; then
            echo " Policy block — secrets exceed configured severity threshold."
            exit 1
          fi

          if [ "${{ env.GITLEAKS_EXIT }}" = "2" ] && [ "${{ env.SCAN_EXIT }}" != "0" ]; then
            echo " Gitleaks found secrets and policy exit was non-zero."
            exit 1
          fi

          echo " No blocking secrets found."