name: Secrets Scan

on:
  workflow_call:
    inputs:
      run-gitleaks:
        description: "Run Gitleaks alongside the custom scanner"
        required: false
        type: boolean
        default: true
      block-on-findings:
        description: "Block merge when HIGH/CRITICAL secrets are found"
        required: false
        type: boolean
        default: true

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write          # needed by repo-freezer to create incident issues

    steps:
      # ── Checkout product repo ─────────────────────────────────────────────
      - name: Checkout product repo
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0     # full history needed for gitleaks

      # ── Checkout guardrails repo ──────────────────────────────────────────
      - name: Checkout guardrails repo
        uses: actions/checkout@v4
        with:
          repository: Faslanrizni/security-guardrails-faslan
          ref: testing
          path: guardrails

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests pyyaml

      # ── Pre-create report files ───────────────────────────────────────────
      - name: Initialise report files
        run: |
          echo '{"version":"1.0.0","blocked":false,"summary":{"total":0},"findings":[]}' \
            > secrets-scan-results.json
          echo '{"version":"1.0.0","action":"freeze","simulation":true,"steps":[]}' \
            > freeze-report.json

      # ── Gitleaks ──────────────────────────────────────────────────────────
      - name: Run Gitleaks
        if: ${{ inputs.run-gitleaks }}
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: guardrails/tools/secrets/gitleaks.toml
          path: product
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # only needed for org-level scans
        continue-on-error: true   # custom scanner decides the final block

      # ── Custom secrets scanner ────────────────────────────────────────────
      - name: Run Custom Secrets Scanner
        id: secrets_scan
        run: |
          set +e

          python guardrails/tools/secrets/secrets-scanner.py \
            --repo-path product \
            --policy guardrails/policies/secrets.yaml \
            --json-output secrets-scan-results.json \
            --verbose

          SCAN_EXIT=$?
          echo "SCAN_EXIT=$SCAN_EXIT" >> $GITHUB_ENV
          exit 0

      # ── Repo freeze on CRITICAL findings ──────────────────────────────────
      - name: Freeze repo on critical secret leak
        if: ${{ inputs.block-on-findings }}
        run: |
          set +e

          # Check if any CRITICAL findings exist in the JSON
          CRITICAL=$(python3 -c "
          import json, sys
          data = json.load(open('secrets-scan-results.json'))
          crits = [f for f in data.get('findings', []) if f['severity'] == 'CRITICAL']
          if crits:
              print(crits[0]['type'])
          " 2>/dev/null)

          if [ -n "$CRITICAL" ]; then
            echo " CRITICAL secret detected: $CRITICAL — triggering repo freeze"

            python guardrails/tools/secrets/repo-freezer.py \
              "${{ github.repository }}" \
              --secret-type "$CRITICAL" \
              --description "Critical secret detected in CI scan" \
              --commit "${{ github.sha }}" \
              --json-output freeze-report.json
          else
            echo " No CRITICAL secrets — skipping freeze"
          fi

          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Upload reports ────────────────────────────────────────────────────
      - name: Upload Secrets Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-results
          path: |
            secrets-scan-results.json
            freeze-report.json
          retention-days: 30

      # ── PR comment ────────────────────────────────────────────────────────
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';

            try {
              const raw  = fs.readFileSync('secrets-scan-results.json', 'utf8');
              const data = JSON.parse(raw);
              const s    = data.summary || {};

              if (data.blocked) {
                body = `##  Secrets Detected — Merge Blocked\n\n`;
                body += `**${s.total || 0}** secret(s) found: `;
                body += `${s.critical || 0} critical · ${s.high || 0} high · ${s.medium || 0} medium\n\n`;
                body += `> Rotate all exposed credentials immediately before this PR can be merged.\n\n`;
              } else if ((s.total || 0) > 0) {
                body = `##  Possible Secrets Detected\n\n`;
                body += `**${s.total}** finding(s) flagged for review.\n\n`;
              } else {
                body = `##  Secrets Scan — Clean\n\nNo secrets detected.`;
              }

              if (data.findings && data.findings.length > 0) {
                body += `**Findings:**\n`;
                for (const f of data.findings.slice(0, 10)) {
                  const icon = f.severity === 'CRITICAL' ? '🔴' : f.severity === 'HIGH' ? '🟠' : '🟡';
                  body += `\n${icon} \`${f.file}:${f.line}\` — \`${f.type}\``;
                }
                if (data.findings.length > 10) {
                  body += `\n\n_...and ${data.findings.length - 10} more. Download the artifact for the full report._`;
                }
              }
            } catch (e) {
              body = `##  Secrets Scan — Could not parse results\n\n${e.message}`;
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── Enforce block ─────────────────────────────────────────────────────
      - name: Enforce Block Policy
        if: ${{ inputs.block-on-findings }}
        run: |
          echo "Scanner exit code: ${{ env.SCAN_EXIT }}"
          if [ "${{ env.SCAN_EXIT }}" = "1" ]; then
            echo " Secrets detected — blocking merge."
            exit 1
          fi
          echo " No blocking secrets found."