title   = "Security Guardrails — Gitleaks Configuration"
version = 2

# ── Global allowlist ──────────────────────────────────────────────────────────
[allowlist]
description = "Global paths and patterns to ignore"
paths = [
  '''node_modules''',
  '''vendor''',
  '''venv''',
  '''.git''',
  '''__pycache__''',
  '''dist''',
  '''build''',
  '''tests/fixtures''',
  '''testdata''',
  '''\.min\.js$''',
]
regexes = [
  # Git SHAs are not secrets
  '''[a-f0-9]{40}''',
  # Localhost URLs
  '''(localhost|127\.0\.0\.1)(:\d+)?''',
]

# ── Rules ─────────────────────────────────────────────────────────────────────

[[rules]]
id          = "aws-access-key"
description = "AWS Access Key ID"
regex       = '''\bAKIA[0-9A-Z]{16}\b'''
tags        = ["aws", "credentials", "cloud"]
severity    = "CRITICAL"

[[rules]]
id          = "aws-secret-key"
description = "AWS Secret Access Key"
regex       = '''\b[0-9a-zA-Z/+]{40}\b'''
tags        = ["aws", "credentials", "cloud"]
severity    = "CRITICAL"
  [rules.allowlist]
  regexes = ['''[a-f0-9]{40}''']   # exclude plain git SHAs

[[rules]]
id          = "github-pat-classic"
description = "GitHub Personal Access Token (classic)"
regex       = '''\bghp_[0-9a-zA-Z]{36}\b'''
tags        = ["github", "credentials"]
severity    = "CRITICAL"

[[rules]]
id          = "github-pat-fine"
description = "GitHub Fine-Grained Personal Access Token"
regex       = '''\bgithub_pat_[A-Za-z0-9_]{80,}\b'''
tags        = ["github", "credentials"]
severity    = "CRITICAL"

[[rules]]
id          = "github-oauth-token"
description = "GitHub OAuth / App Token"
regex       = '''\bgh[pousr]_[A-Za-z0-9]{36,}\b'''
tags        = ["github", "credentials"]
severity    = "CRITICAL"

[[rules]]
id          = "gcp-api-key"
description = "Google Cloud Platform API Key"
regex       = '''\bAIza[0-9A-Za-z\-_]{35}\b'''
tags        = ["gcp", "credentials", "cloud"]
severity    = "HIGH"

[[rules]]
id          = "google-oauth"
description = "Google OAuth Access Token"
regex       = '''\bya29\.[0-9A-Za-z\-_]+\b'''
tags        = ["google", "credentials"]
severity    = "HIGH"

[[rules]]
id          = "stripe-secret-key"
description = "Stripe Secret API Key"
regex       = '''\bsk_(live|test)_[0-9A-Za-z]{24,}\b'''
tags        = ["stripe", "credentials", "payment"]
severity    = "CRITICAL"

[[rules]]
id          = "slack-token"
description = "Slack Bot / App / User Token"
regex       = '''\bxox[baprs]-[0-9A-Za-z\-]{10,}\b'''
tags        = ["slack", "credentials"]
severity    = "HIGH"

[[rules]]
id          = "jwt-token"
description = "JSON Web Token"
regex       = '''\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b'''
tags        = ["jwt", "credentials"]
severity    = "HIGH"

[[rules]]
id          = "azure-storage-key"
description = "Azure Storage Account Key"
regex       = '''AccountKey=[A-Za-z0-9+/=]{88}'''
tags        = ["azure", "credentials", "cloud"]
severity    = "CRITICAL"

[[rules]]
id          = "firebase-server-key"
description = "Firebase Server Key"
regex       = '''\bAAAA[A-Za-z0-9_-]{7}:[A-Za-z0-9_-]{140}\b'''
tags        = ["firebase", "credentials"]
severity    = "HIGH"

[[rules]]
id          = "database-connection-string"
description = "Database Connection String with credentials"
regex       = '''(postgres|mysql|mongodb|redis):\/\/[^:]+:[^@\s]+@'''
tags        = ["database", "credentials"]
severity    = "CRITICAL"

[[rules]]
id          = "private-key-block"
description = "PEM Private Key Block"
regex       = '''-----BEGIN (RSA|DSA|EC|OPENSSH|PRIVATE) KEY-----'''
tags        = ["key", "credentials", "pki"]
severity    = "CRITICAL"

[[rules]]
id          = "hardcoded-env-secret"
description = "Hardcoded secret in environment variable assignment"
regex       = '''(?i)(SECRET|TOKEN|KEY|PASSWORD|PWD)\s*[=:]\s*["'][^"']{8,}["']'''
tags        = ["credentials", "hardcoded"]
severity    = "HIGH"
  [rules.allowlist]
  regexes = [
    '''(?i)(example|sample|test|mock|dummy|fake|placeholder|changeme)''',
  ]

[[rules]]
id          = "bearer-token"
description = "Bearer token in Authorization header"
regex       = '''(?i)Authorization\s*[:=]\s*["']?Bearer\s+[A-Za-z0-9\-._~+/]{40,}'''
tags        = ["credentials", "http"]
severity    = "HIGH"