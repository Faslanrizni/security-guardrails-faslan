ai_code:

  # ── Detection toggle ────────────────────────────────────────────────────────
  detection:
    enabled: true                        # set to false to skip all AI scanning
    tool: tools/ai-detection/ai-code-detector.py
    version: "1.4.0"

  # ── Confidence thresholds ───────────────────────────────────────────────────
  # score 0.00–0.39 → clean, no action
  # score 0.40–0.69 → flagged in PR comment (possible AI)
  # score 0.70–1.00 → blocks merge (requires review)
  thresholds:
    flag:  0.40
    block: 0.70

  # ── Signal weights ──────────────────────────────────────────────────────────
  # These three are read directly by the detector.
  # Raise a weight → that signal contributes more to the score.
  # Lower a weight → fewer false positives from that signal.
  tuning:
    explicit_ai_signature_weight: 0.50   # "Generated by Copilot/Claude/ChatGPT"
    high_comment_density_weight:  0.20   # comment lines > 45% of total lines
    placeholder_name_weight:      0.10   # foo/bar/MyClass/myFunction etc.

  # ── Enforcement ─────────────────────────────────────────────────────────────
  enforcement:
    require_extra_review: true           # documented intent — reviewer gate
    stricter_sast: true                  # documented intent — extended semgrep ruleset
    block_merge: true                    # CI exits 1 when score ≥ block threshold

  # ── Scan scope ──────────────────────────────────────────────────────────────
  scan:
    commit_messages: true                # analyse commit message for AI patterns
    file_content: true                   # analyse changed file content

    # File extensions to scan — must include the dot
    extensions:
      - .py
      - .js
      - .ts
      - .jsx
      - .tsx
      - .java
      - .go
      - .rb
      - .php
      - .c
      - .cpp
      - .h
      - .cs
      - .swift
      - .rs
      - .kt

    # Paths to never scan — trailing / means directory prefix, *. means extension glob
    exclude_paths:
      - "vendor/"
      - "node_modules/"
      - "dist/"
      - "build/"
      - ".github/"
      - "*.min.js"

  # ── Reporting ────────────────────────────────────────────────────────────────
  reporting:
    pr_comment: true                     # post findings as a PR comment
    artifact_name: ai-detection-results  # GitHub Actions artifact name
    retention_days: 30
    json_output: true                    # write structured JSON results file