# Trivy configuration file
# Policy source: policies/dependencies.yaml

scan:
  scanners:
    - vuln
    - secret
    - misconfig

vulnerability:
  ignore-unfixed: true
  severity:
    - HIGH
    - CRITICAL

timeout: 10m

# License scanning — maps from policies/dependencies.yaml → disallowed_licenses
license:
  forbidden:
    - GPL-3.0
    - AGPL-3.0