# ======================================================================
# ALLOWED DEPENDENCIES POLICY
# ======================================================================
# This file is the SINGLE SOURCE OF TRUTH for dependency approval.
# It is both human-readable AND machine-enforced by CI guardrails.
#
# ENFORCEMENT FLOW:
#   1. PR is opened / pushed
#   2. CI checks out this guardrails repo
#   3. allowed-dependencies-enforcer.py reads this file
#   4. Every dependency in package.json / go.mod / requirements.txt
#      is validated against the lists below
#   5. If unapproved → build fails with instructions
#

# ======================================================================

allowed_dependencies:

  # ════════════════════════════════════════════════════════════════════
  # GO
  # ════════════════════════════════════════════════════════════════════
  go:
    allowed:
      # Web frameworks
      - github.com/gin-gonic/gin
      - github.com/go-chi/chi
      - github.com/go-chi/cors
      - github.com/labstack/echo/v4
      - github.com/gorilla/mux

      # Auth / JWT
      - github.com/go-chi/jwtauth/v5

      # Database drivers / ORM helpers
      - github.com/jackc/pgx
      - github.com/go-sql-driver/mysql
      - github.com/lib/pq
      - github.com/jmoiron/sqlx
      - modernc.org/sqlite

      # Cryptography
      - golang.org/x/crypto

      # API Documentation / Swagger
      - github.com/swaggo/http-swagger
      - github.com/swaggo/swag

      # Utilities
      - github.com/spf13/viper
      - github.com/joho/godotenv
      - github.com/sirupsen/logrus
      - go.uber.org/zap

      # Testing
      - github.com/stretchr/testify
      - github.com/golang/mock

    blocked:
      - package: github.com/dgrijalva/jwt-go
        reason: "Unmaintained — use github.com/golang-jwt/jwt instead"

      - package: github.com/gorilla/context
        reason: "Deprecated — functionality is in stdlib context package"

      - package: github.com/davecgh/go-spew/spew
        reason: "Debug-only package — not permitted in production code"

      - package: github.com/pkg/errors
        reason: "Use native Go errors with fmt.Errorf and errors.Is/As"

    requires_review:
      - github.com/aws/aws-sdk-go
      - github.com/google/go-containerregistry
      - github.com/hashicorp/vault

  # ════════════════════════════════════════════════════════════════════
  # JAVASCRIPT / NODE.JS
  # ════════════════════════════════════════════════════════════════════
  js:
    allowed:
      # Frameworks
      - express
      - fastify
      - nestjs

      # Validation
      - zod
      - joi
      - yup

      # HTTP clients
      - axios
      - node-fetch

      # Utilities
      - lodash
      - date-fns
      - dotenv

      # Testing
      - jest
      - vitest

    blocked:
      - package: request
        reason: "Deprecated — use axios or node-fetch"
      - package: left-pad
        reason: "Trivial package — use native String.prototype.padStart()"
      - package: is-positive
        reason: "Unnecessary micro-package"
      - package: colors.js
        reason: "Supply chain attack history — use chalk or picocolors"
      - package: event-stream
        reason: "Known backdoor incident"

    requires_review:
      - puppeteer                  # Browser automation
      - playwright                 # Browser automation
      - puppeteer-core             # Browser automation
      - crypto-js                  # Client-side crypto

  # ════════════════════════════════════════════════════════════════════
  # PYTHON
  # ════════════════════════════════════════════════════════════════════
  python:
    allowed:
      # Web frameworks
      - django
      - flask
      - fastapi

      # Database
      - sqlalchemy
      - psycopg2-binary
      - pymongo

      # Validation
      - pydantic
      - marshmallow

      # Utilities
      - python-dotenv
      - requests
      - click
      - pyyaml

      # Testing
      - pytest
      - pytest-cov
      - mock

    blocked:
      - package: pycrypto
        reason: "Unmaintained — use pycryptodome"
      - package: md5
        reason: "Insecure — use hashlib"
      - package: pickle
        reason: "Insecure deserialization — avoid or sandbox carefully"
      - package: PyYAML
        reason: "Use pyyaml (lowercase) and always call yaml.safe_load()"

    requires_review:
      - tensorflow                 # ML framework — large attack surface
      - torch                      # ML framework — large attack surface
      - cryptography               # Crypto operations
      - boto3                      # AWS SDK

# ======================================================================
# ENFORCEMENT SETTINGS
# ======================================================================
enforcement:
  # Fail build when unapproved packages are found
  block_on_unapproved: true

  # Fail build when explicitly blocked packages are found
  block_on_blocked: true

  # Warn (but don't fail) when requires_review packages are found
  # Set to true to also block on these
  block_on_requires_review: false

  # Check transitive (indirect) dependencies in addition to direct ones
  check_transitive: false

  # Post a PR comment with findings (GitHub Actions only)
  pr_comment: true

  # Artifact retention days
  retention_days: 30