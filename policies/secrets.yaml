secrets:

  # ── Scan toggle ─────────────────────────────────────────────────────────────
  scan:
    pre_commit: true
    ci: true

  # ── Severities that cause CI to block ───────────────────────────────────────
  block_on_severity:
    - CRITICAL
    - HIGH

  # ── Enforcement ─────────────────────────────────────────────────────────────
  enforcement:
    block_commit: true
    block_merge:  true
    require_rotation: true        # documented: rotation must be confirmed to unfreeze

  # ── Freeze behaviour ────────────────────────────────────────────────────────
  freeze:
    enabled: true                 # auto-freeze repo on CRITICAL finding
    create_issue: true            # open a GitHub issue for the incident
    required_approvals: 2         # branch protection sets this during freeze
